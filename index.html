<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Stock Barang</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #1f2937;
}

.header {
    background: #111827;
    color: white;
    padding: 20px;
}

.header h1 {
    margin: 0;
    font-size: 24px;
}

.header p {
    margin: 5px 0 0;
    color: #d1d5db;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 15px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 15px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

h2 {
    margin-top: 0;
    font-size: 19px;
}

.controls {
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 12px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 5px;
}

input[type="text"],
input[type="number"],
input[type="date"],
select {
    width: 100%;
    padding: 11px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
}

.status {
    margin-top: 10px;
    font-size: 14px;
}

.success {
    color: #15803d;
}

.error {
    color: #b91c1c;
}

.button-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
}

.main-btn {
    border: none;
    border-radius: 8px;
    padding: 10px 15px;
    background: #111827;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.main-btn:active {
    transform: scale(.97);
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.stat {
    background: #f9fafb;
    padding: 15px;
    border-radius: 10px;
}

.stat small {
    color: #6b7280;
}

.stat strong {
    display: block;
    margin-top: 5px;
    font-size: 23px;
}

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

th,
td {
    padding: 11px;
    border-bottom: 1px solid #e5e7eb;
    text-align: left;
}

th {
    background: #f3f4f6;
}

td:last-child,
th:last-child {
    text-align: center;
}

.stock-habis {
    color: #dc2626;
    font-weight: bold;
}

.stock-menipis {
    color: #d97706;
    font-weight: bold;
}

.stock-aman {
    color: #15803d;
    font-weight: bold;
}

.action-btn {
    border: none;
    border-radius: 7px;
    padding: 7px 10px;
    margin: 2px;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.btn-masuk {
    background: #15803d;
}

.btn-laku {
    background: #dc2626;
}

.action-btn:active {
    transform: scale(.96);
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.modal-content {
    background: white;
    width: 100%;
    max-width: 400px;
    border-radius: 15px;
    padding: 20px;
}

.modal-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 8px;
}

.modal-product {
    color: #6b7280;
    margin-bottom: 18px;
}

.modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.modal-actions button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.btn-confirm {
    background: #111827;
    color: white;
}

.btn-cancel {
    background: #e5e7eb;
}

.history-table {
    min-width: 750px;
}

.delete-btn {
    border: none;
    background: #fee2e2;
    color: #b91c1c;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
}

.empty {
    text-align: center;
    color: #6b7280;
    padding: 30px;
}

.loading {
    text-align: center;
    padding: 25px;
    color: #6b7280;
}

.database-info {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    padding: 12px;
    border-radius: 8px;
    margin-top: 10px;
}

@media(max-width:600px) {

    .container {
        padding: 10px;
    }

    .controls {
        grid-template-columns: 1fr;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .header h1 {
        font-size: 21px;
    }

}

</style>

</head>


<body>

<h1>📦 Stock Barang</h1>

<main class="container">

<!-- STATISTIK -->

0
</strong>

</div>

0

<!-- TABEL STOK -->

<section class="card">

<h2>📦 Daftar Stok</h2>

<div class="table-wrapper">

<table>

<thead>

<tr>

<th>No</th>

<th>Nama Barang</th>

<th>Stok</th>

</thead>

<tr>

<td

>
⏳ Memuat data...

</tr>

</table>

</div>

<!-- RIWAYAT -->

<section class="card">

<h2>📜 Riwayat Transaksi</h2>

<div class="table-wrapper">

<table class="history-table">

<thead>

<tr>

<th>Waktu</th>

<th>Barang</th>

<th>Tanggal</th>

<th>Transaksi</th>

<th>Qty</th>

<th>Stok</th>

<th>Aksi</th>

</tr>

</thead>


<tbody id="historyTable">

<tr>

<td
    colspan="7"
    class="empty"
>
Belum ada transaksi
</td>

</tr>

</tbody>

</table>

</div>

</section>


</main>


<!-- MODAL -->

<div
    class="modal"
    id="transactionModal"
>

<div class="modal-content">


<div
    class="modal-title"
    id="modalTitle"
>
</div>


<div
    class="modal-product"
    id="modalProduct"
>
</div>


<label>Jumlah</label>


<input
    type="number"
    id="transactionQty"
    min="1"
    value="1"
>


<div class="modal-actions">


<button
    class="btn-cancel"
    onclick="closeModal()"
>
Batal
</button>


<button
    class="btn-confirm"
    onclick="confirmTransaction()"
>
Simpan
</button>


</div>


</div>

</div>


<script>


/* =========================================
   KONFIGURASI SUPABASE
========================================= */

const SUPABASE_URL =
    "MASUKKAN_PROJECT_URL";

const SUPABASE_KEY =
    "MASUKKAN_PUBLISHABLE_KEY";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   DATA APLIKASI
========================================= */

let dataBarang = [];

let transactions = [];

let tanggalDipilih = "";

let selectedProduct = null;

let selectedTransactionType = "";


/* =========================================
   FORMAT ANGKA
========================================= */

function formatNumber(number) {

    return new Intl.NumberFormat(
        "id-ID"
    ).format(number);

}


/* =========================================
   FORMAT TANGGAL
========================================= */

function formatTanggal(tanggal) {

    if (!tanggal) {
        return "-";
    }

    const date =
        new Date(
            tanggal + "T00:00:00"
        );

    return date.toLocaleDateString(
        "id-ID",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );

}


/* =========================================
   TANGGAL HARI INI
========================================= */

function getTodayDate() {

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            now.getDate()
        ).padStart(2, "0");

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


/* =========================================
   STATUS DATABASE
========================================= */

function setDatabaseStatus(
    message,
    type = ""
) {

    const element =
        document.getElementById(
            "databaseStatus"
        );

    element.textContent =
        message;

    element.className =
        "status " + type;

}


/* =========================================
   LOAD BARANG
========================================= */

async function loadBarang() {

    setDatabaseStatus(
        "⏳ Mengambil data barang..."
    );

    const {
        data,
        error
    } =
        await supabaseClient
            .from("barang")
            .select("*")
            .order(
                "nama",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(error);

        setDatabaseStatus(
            "❌ Gagal mengambil data barang: " +
            error.message,
            "error"
        );

        return;

    }


    dataBarang =
        data || [];


    setDatabaseStatus(
        "✅ Database terhubung. " +
        dataBarang.length +
        " barang ditemukan.",
        "success"
    );


    updateTable();

}


/* =========================================
   LOAD TRANSAKSI
========================================= */

async function loadTransactions() {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("transaksi")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(error);

        setDatabaseStatus(
            "❌ Gagal mengambil transaksi: " +
            error.message,
            "error"
        );

        return;

    }


    transactions =
        data || [];


    updateTable();

}


/* =========================================
   TAMBAH BARANG
========================================= */

async function tambahBarang() {

    const namaInput =
        document.getElementById(
            "namaBarang"
        );

    const stokInput =
        document.getElementById(
            "stokAwal"
        );


    const nama =
        namaInput.value.trim();


    const stokAwal =
        Number(
            stokInput.value
        );


    if (!nama) {

        alert(
            "Nama barang harus diisi."
        );

        namaInput.focus();

        return;

    }


    if (
        !Number.isFinite(stokAwal) ||
        stokAwal < 0
    ) {

        alert(
            "Stok awal tidak valid."
        );

        return;

    }


    /*
     * Cek apakah barang sudah ada
     */

    const barangSudahAda =
        dataBarang.some(
            function(barang) {

                return (
                    barang.nama
                        .toLowerCase()
                        .trim() ===
                    nama.toLowerCase()
                        .trim()
                );

            }
        );


    if (barangSudahAda) {

        alert(
            "Barang dengan nama tersebut sudah ada."
        );

        return;

    }


    setDatabaseStatus(
        "⏳ Menyimpan barang..."
    );


    const {
        error
    } =
        await supabaseClient
            .from("barang")
            .insert({
                nama: nama,
                stok_awal: stokAwal
            });


    if (error) {

        console.error(error);

        setDatabaseStatus(
            "❌ Gagal menyimpan barang: " +
            error.message,
            "error"
        );

        return;

    }


    namaInput.value = "";

    stokInput.value = "0";


    setDatabaseStatus(
        "✅ Barang berhasil ditambahkan.",
        "success"
    );


    await loadBarang();

}


/* =========================================
   HITUNG STOK
========================================= */

function getCurrentStock(
    barang
) {

    let stok =
        Number(
            barang.stok_awal
        ) || 0;


    transactions.forEach(
        function(transaction) {

            if (
                Number(
                    transaction.barang_id
                ) !==
                Number(
                    barang.id
                )
            ) {

                return;

            }


            /*
             * Hanya transaksi
             * sampai tanggal yang dipilih
             */

            if (
                tanggalDipilih &&
                transaction.tanggal >
                tanggalDipilih
            ) {

                return;

            }


            if (
                transaction.type ===
                "masuk"
            ) {

                stok +=
                    Number(
                        transaction.qty
                    );

            }


            if (
                transaction.type ===
                "laku"
            ) {

                stok -=
                    Number(
                        transaction.qty
                    );

            }

        }
    );


    return stok;

}


/* =========================================
   UPDATE TABEL
========================================= */

function updateTable() {

    const tbody =
        document.getElementById(
            "stockTable"
        );


    const search =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();


    if (
        dataBarang.length === 0
    ) {

        tbody.innerHTML =
            `
            <tr>
                <td
                    colspan="4"
                    class="empty"
                >
                    Belum ada barang.
                    Silakan tambahkan barang.
                </td>
            </tr>
            `;

        updateStats();

        return;

    }


    const filtered =
        dataBarang.filter(
            function(barang) {

                return barang.nama
                    .toLowerCase()
                    .includes(search);

            }
        );


    if (
        filtered.length === 0
    ) {

        tbody.innerHTML =
            `
            <tr>
                <td
                    colspan="4"
                    class="empty"
                >
                    Barang tidak ditemukan.
                </td>
            </tr>
            `;

        updateStats();

        return;

    }


    tbody.innerHTML = "";


    filtered.forEach(
        function(barang, index) {

            const stok =
                getCurrentStock(
                    barang
                );


            let statusClass =
                "stock-aman";


            if (
                stok <= 0
            ) {

                statusClass =
                    "stock-habis";

            }

            else if (
                stok <= 5
            ) {

                statusClass =
                    "stock-menipis";

            }


            const tr =
                document.createElement(
                    "tr"
                );


            tr.innerHTML =
                `
                <td>
                    ${index + 1}
                </td>

                <td>
                    ${escapeHTML(
                        barang.nama
                    )}
                </td>

                <td class="${statusClass}">
                    ${formatNumber(stok)}
                </td>

                <td>

                    <button
                        class="action-btn btn-masuk"
                        onclick="openTransaction(
                            ${Number(barang.id)},
                            'masuk'
                        )"
                    >
                        ➕ Masuk
                    </button>

                    <button
                        class="action-btn btn-laku"
                        onclick="openTransaction(
                            ${Number(barang.id)},
                            'laku'
                        )"
                    >
                        🛒 Laku
                    </button>

                </td>
                `;


            tbody.appendChild(
                tr
            );

        }
    );


    updateStats();

}


/* =========================================
   STATISTIK
========================================= */

function updateStats() {

    let totalStok = 0;


    dataBarang.forEach(
        function(barang) {

            totalStok +=
                getCurrentStock(
                    barang
                );

        }
    );


    const transaksiHariIni =
        transactions.filter(
            function(transaction) {

                if (
                    !tanggalDipilih
                ) {

                    return false;

                }

                return (
                    transaction.tanggal ===
                    tanggalDipilih
                );

            }
        ).length;


    document.getElementById(
        "totalBarang"
    ).textContent =
        formatNumber(
            dataBarang.length
        );


    document.getElementById(
        "totalStok"
    ).textContent =
        formatNumber(
            totalStok
        );


    document.getElementById(
        "transaksiHariIni"
    ).textContent =
        formatNumber(
            transaksiHariIni
        );


    renderHistory();

}


/* =========================================
   BUKA MODAL
========================================= */

function openTransaction(
    barangId,
    type
) {

    const barang =
        dataBarang.find(
            function(item) {

                return (
                    Number(item.id) ===
                    Number(barangId)
                );

            }
        );


    if (!barang) {

        alert(
            "Barang tidak ditemukan."
        );

        return;

    }


    selectedProduct =
        barang.id;


    selectedTransactionType =
        type;


    const modal =
        document.getElementById(
            "transactionModal"
        );


    const title =
        document.getElementById(
            "modalTitle"
        );


    const product =
        document.getElementById(
            "modalProduct"
        );


    if (
        type === "masuk"
    ) {

        title.textContent =
            "➕ Barang Masuk";

    }

    else {

        title.textContent =
            "🛒 Barang Laku";

    }


    product.textContent =
        barang.nama;


    document.getElementById(
        "transactionQty"
    ).value = 1;


    modal.style.display =
        "flex";

}


/* =========================================
   TUTUP MODAL
========================================= */

function closeModal() {

    document.getElementById(
        "transactionModal"
    ).style.display =
        "none";

}


/* =========================================
   SIMPAN TRANSAKSI
========================================= */

async function confirmTransaction() {

    const input =
        document.getElementById(
            "transactionQty"
        );


    const qty =
        Number(
            input.value
        );


    if (
        !Number.isFinite(qty) ||
        qty <= 0
    ) {

        alert(
            "Jumlah harus lebih dari 0."
        );

        return;

    }


    const barang =
        dataBarang.find(
            function(item) {

                return (
                    Number(item.id) ===
                    Number(selectedProduct)
                );

            }
        );


    if (!barang) {

        alert(
            "Barang tidak ditemukan."
        );

        return;

    }


    /*
     * Cek stok untuk barang laku
     */

    if (
        selectedTransactionType ===
        "laku"
    ) {

        const stok =
            getCurrentStock(
                barang
            );


        if (
            qty > stok
        ) {

            alert(
                "Jumlah barang laku melebihi stok.\n\n" +
                "Stok tersedia: " +
                formatNumber(stok)
            );

            return;

        }

    }


    const tanggal =
        tanggalDipilih ||
        getTodayDate();


    const {
        error
    } =
        await supabaseClient
            .from("transaksi")
            .insert({

                barang_id:
                    barang.id,

                tanggal:
                    tanggal,

                type:
                    selectedTransactionType,

                qty:
                    qty

            });


    if (error) {

        console.error(error);

        alert(
            "Gagal menyimpan transaksi:\n" +
            error.message
        );

        return;

    }


    closeModal();


    await loadTransactions();

}


/* =========================================
   RIWAYAT TRANSAKSI
========================================= */

function renderHistory() {

    const tbody =
        document.getElementById(
            "historyTable"
        );


    if (
        transactions.length === 0
    ) {

        tbody.innerHTML =
            `
            <tr>
                <td
                    colspan="7"
                    class="empty"
                >
                    Belum ada transaksi
                </td>
            </tr>
            `;

        return;

    }


    const history =
        [...transactions]
            .reverse();


    tbody.innerHTML = "";


    history.forEach(
        function(transaction) {

            const barang =
                dataBarang.find(
                    function(item) {

                        return (
                            Number(
                                item.id
                            ) ===
                            Number(
                                transaction.barang_id
                            )
                        );

                    }
                );


            const namaBarang =
                barang
                    ? barang.nama
                    : "Barang dihapus";


            const typeText =
                transaction.type ===
                "masuk"
                    ? "➕ Barang Masuk"
                    : "🛒 Barang Laku";


            const qtyText =
                transaction.type ===
                "masuk"
                    ? "+" +
                      formatNumber(
                          transaction.qty
                      )
                    : "-" +
                      formatNumber(
                          transaction.qty
                      );


            let stokAkhir = "-";


            /*
             * Hitung stok setelah transaksi
             */

            if (barang) {

                stokAkhir =
                    getStockAfterTransaction(
                        barang,
                        transaction
                    );

            }


            const waktu =
                transaction.created_at
                    ? new Date(
                        transaction.created_at
                    ).toLocaleString(
                        "id-ID"
                    )
                    : "-";


            const tr =
                document.createElement(
                    "tr"
                );


            tr.innerHTML =
                `
                <td>
                    ${escapeHTML(waktu)}
                </td>

                <td>
                    ${escapeHTML(
                        namaBarang
                    )}
                </td>

                <td>
                    ${formatTanggal(
                        transaction.tanggal
                    )}
                </td>

                <td>
                    ${typeText}
                </td>

                <td>
                    ${qtyText}
                </td>

                <td>
                    ${formatNumber(
                        stokAkhir
                    )}
                </td>

                <td>

                    <button
                        class="delete-btn"
                        onclick="deleteTransaction(
                            ${Number(transaction.id)}
                        )"
                    >
                        Hapus
                    </button>

                </td>
                `;


            tbody.appendChild(
                tr
            );

        }
    );

}


/* =========================================
   STOK SETELAH TRANSAKSI
========================================= */

function getStockAfterTransaction(
    barang,
    targetTransaction
) {

    let stok =
        Number(
            barang.stok_awal
        ) || 0;


    transactions.forEach(
        function(transaction) {

            if (
                Number(
                    transaction.barang_id
                ) !==
                Number(
                    barang.id
                )
            ) {

                return;

            }


            /*
             * Hanya sampai tanggal transaksi
             */

            if (
                transaction.tanggal >
                targetTransaction.tanggal
            ) {

                return;

            }


            /*
             * Untuk tanggal yang sama,
             * gunakan urutan waktu database.
             */

            if (
                transaction.tanggal ===
                targetTransaction.tanggal
            ) {

                if (
                    new Date(
                        transaction.created_at
                    ) >
                    new Date(
                        targetTransaction.created_at
                    )
                ) {

                    return;

                }

            }


            if (
                transaction.type ===
                "masuk"
            ) {

                stok +=
                    Number(
                        transaction.qty
                    );

            }


            if (
                transaction.type ===
                "laku"
            ) {

                stok -=
                    Number(
                        transaction.qty
                    );

            }

        }
    );


    return stok;

}


/* =========================================
   HAPUS TRANSAKSI
========================================= */

async function deleteTransaction(
    id
) {

    const confirmDelete =
        confirm(
            "Hapus transaksi ini?"
        );


    if (!confirmDelete) {

        return;

    }


    const {
        error
    } =
        await supabaseClient
            .from("transaksi")
            .delete()
            .eq(
                "id",
                id
            );


    if (error) {

        console.error(error);

        alert(
            "Gagal menghapus transaksi:\n" +
            error.message
        );

        return;

    }


    await loadTransactions();

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
