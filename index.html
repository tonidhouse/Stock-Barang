<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Stock Barang</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">

<h1>📦 Stock Barang</h1>

<p>Rekap Stok & Transaksi</p>

</header>


<main class="container">
<section class="card">

<h2>🔎 Rekap Stok</h2>

<div class="controls">

<div>

<label>Tanggal</label>

<input
    type="date"
    id="tanggal"
>

</div>


<div>

<label>Cari Barang</label>

<input
    type="text"
    id="search"
    placeholder="Ketik nama barang..."
>

</div>

</div>

</section>

<section class="card">

<h2>📦 Data Barang</h2>

<div class="controls">

<div>

<label>Nama Barang</label>

<input
    type="text"
    id="namaBarang"
    placeholder="Nama barang..."
>

</div>


<div>

<label>Stok Awal</label>

<input
    type="number"
    id="stokAwal"
    min="0"
    value="0"
>

</div>

</div>


<div class="button-row">

<button
    class="main-btn"
    onclick="tambahBarang()"
>
➕ Tambah Barang
</button>

</div>


<div
    id="databaseStatus"
    class="status"
>
⏳ Menghubungkan ke database...
</div>

</section>



<!-- STATISTIK -->

<section class="card">

<div class="stats">

<div class="stat">

<small>Total Barang</small>

<strong id="totalBarang">
0
</strong>

</div>


<div class="stat">

<small>Total Stok</small>

<strong id="totalStok">
0
</strong>

</div>


<div class="stat">

<small>Transaksi Hari Ini</small>

<strong id="transaksiHariIni">
0
</strong>

</div>

</div>

</section>


<!-- TABEL STOK -->

<section class="card">

<h2>📦 Daftar Stok</h2>

<div class="table-wrapper">

<table>

<thead>

<tr>

<th>No</th>

<th>Nama Barang</th>

<th>Stok</th>
</tr>

</thead>


<tbody id="stockTable">

<tr>

<td
    colspan="4"
    class="loading"
>
⏳ Memuat data...
</td>

</tr>

</tbody>

</table>

</div>

</section>


<!-- RIWAYAT -->

<section class="card">

<h2>📜 Riwayat Transaksi</h2>

<div class="table-wrapper">

<table class="history-table">

<thead>

<tr>

<th>Waktu</th>

<th>Barang</th>

<th>Tanggal</th>

<th>Transaksi</th>

<th>Qty</th>

<th>Stok</th>

<th>Aksi</th>

</tr>

</thead>


<tbody id="historyTable">

<tr>

<td
    colspan="6"
    class="empty"
>
Belum ada transaksi
</td>

</tr>

</tbody>

</table>

</div>

</section>


</main>


<!-- MODAL -->

<div
    class="modal"
    id="transactionModal"
>

<div class="modal-content">


<div
    class="modal-title"
    id="modalTitle"
>
</div>


<div
    class="modal-product"
    id="modalProduct"
>
</div>


<label>Jumlah</label>


<input
    type="number"
    id="transactionQty"
    min="1"
    value="1"
>


<div class="modal-actions">


<button
    class="btn-cancel"
    onclick="closeModal()"
>
Batal
</button>


<button
    class="btn-confirm"
    onclick="confirmTransaction()"
>
Simpan
</button>


</div>


</div>

</div>




    <script src="script.js"></script>

</body>

  </html>
